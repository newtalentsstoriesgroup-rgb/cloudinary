<!doctype html>
<html lang="rw">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin</title>
  <style>
    body { font-family: sans-serif; max-width: 560px; margin: 16px auto; padding: 0 12px; }
    input, button { font-size: 16px; padding: 8px; margin: 4px 0; width: 100%; box-sizing: border-box; }
    li { margin: 6px 0; font-size: 14px; }
  </style>
</head>
<body>
  <h2>Upload video</h2>
  <input id="key" type="password" placeholder="Admin key">
  <input id="title" placeholder="Title">
  <input id="file" type="file" accept="video/*">
  <label>Gahunda (usigeho ubusa = ihita ikina):</label>
  <input id="when" type="datetime-local">
  <button id="go">Upload & Schedule</button>
  <div id="status"></div>
  <h3>Umurongo</h3>
  <ul id="list"></ul>

  <script>
    const $ = id => document.getElementById(id);
    const H = () => ({ 'Content-Type': 'application/json', 'x-admin-key': $('key').value });

    $('go').onclick = async () => {
      const f = $('file').files[0];
      if (!f) return ($('status').textContent = 'Hitamo video');
      const cfg = await (await fetch('/api/config')).json();
      $('status').textContent = 'Uploading to Cloudinary…';
      const fd = new FormData();
      fd.append('file', f);
      fd.append('upload_preset', cfg.uploadPreset);
      const up = await fetch(`https://api.cloudinary.com/v1_1/${cfg.cloudName}/video/upload`, { method: 'POST', body: fd });
      const data = await up.json();
      if (!data.secure_url) return ($('status').textContent = 'Upload failed: ' + (data.error?.message || ''));
      const playAt = $('when').value ? new Date($('when').value).toISOString() : null;
      const r = await fetch('/api/videos', { method: 'POST', headers: H(), body: JSON.stringify({ title: $('title').value, url: data.secure_url, playAt }) });
      $('status').textContent = r.ok ? '✅ Byabitswe' : '❌ ' + r.status;
      load();
    };

    async function load() {
      const r = await fetch('/api/videos', { headers: H() });
      if (!r.ok) return;
      const items = await r.json();
      $('list').innerHTML = items.map(v =>
        `<li><b>${v.title}</b> — ${v.status}<br>${new Date(v.playAt).toLocaleString()} <a href="#" onclick="del('${v.id}')">siba</a></li>`).join('');
    }
    async function del(id) { await fetch('/api/videos/' + id, { method: 'DELETE', headers: H() }); load(); }
    $('key').onchange = load;
  </script>
</body>
</html>
