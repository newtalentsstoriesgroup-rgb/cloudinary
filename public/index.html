<!doctype html>
<html lang="rw">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live</title>
  <style>
    body { margin: 0; background: #000; color: #fff; font-family: sans-serif; }
    video { width: 100%; max-height: 100vh; background: #000; }
    #msg { padding: 8px 12px; font-size: 14px; opacity: .7; }
  </style>
</head>
<body>
  <video id="v" controls autoplay muted playsinline></video>
  <div id="msg">Connecting…</div>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
  <script>
    const video = document.getElementById('v');
    const msg = document.getElementById('msg');
    const src = '/live/stream.m3u8';
    if (Hls.isSupported()) {
      const hls = new Hls({ liveSyncDurationCount: 3 });
      hls.loadSource(src);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, () => { msg.textContent = '🔴 LIVE'; video.play(); });
      hls.on(Hls.Events.ERROR, (_, d) => {
        if (d.fatal) { msg.textContent = 'Nta live ihari. Tegereza…'; setTimeout(() => { hls.loadSource(src); }, 5000); }
      });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = src; // Safari / iOS
    }
  </script>
</body>
</html>
